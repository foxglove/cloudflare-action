name: CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: yarn

      - run: yarn install
      - run: yarn fmt:check
      - run: yarn typecheck
      - run: yarn build
      - run: git diff --exit-code
      - run: yarn test
