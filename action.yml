name: "Deploy to Cloudflare"
description: "Deploy to Cloudflare Pages or Workers with preview support and GitHub Deployments"
author: "Foxglove"

branding:
  icon: "upload-cloud"
  color: "orange"

inputs:
  type:
    description: "Deploy type: 'pages' for Cloudflare Pages or 'workers' for Cloudflare Workers"
    required: true
  apiToken:
    description: "Cloudflare API token"
    required: true
  accountId:
    description: "Cloudflare account ID"
    required: false
  directory:
    description: "Directory of static assets to deploy (required for Pages)"
    required: false
  projectName:
    description: >
      Cloudflare Pages project name (required for Pages).
      Also used as the GitHub Deployment environment label.
    required: false
  environment:
    description: >
      Wrangler environment name (--env flag). When unset, Workers preview
      deploys auto-detect env.preview in wrangler.jsonc / wrangler.json and
      apply --env preview if present, so previews bind to env.preview resources
      instead of production resources. Set this to override the auto-detection
      or to apply an env to production deploys.
    required: false
  workingDirectory:
    description: "Directory to run wrangler commands from"
    required: false
  gitHubToken:
    description: >
      GitHub token for creating Deployment statuses. When provided, a GitHub
      Deployment is created with the deployment URL so it appears in the
      repo's Deployments tab and on PRs.
    required: false
  deployAttempts:
    description: "Number of deploy attempts before failing (default: 1)"
    required: false
    default: "1"
  productionBranch:
    description: "Branch name that triggers a production deploy (default: main)"
    required: false
    default: "main"
  previewDeploy:
    description: "Whether to deploy preview environments for non-production branches (default: true)"
    required: false
    default: "true"

outputs:
  deployment-url:
    description: "URL of the Cloudflare deployment"
  command-output:
    description: "Standard output from the wrangler command"
  command-stderr:
    description: "Standard error from the wrangler command"

runs:
  using: "node24"
  main: "dist/index.cjs"
